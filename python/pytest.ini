[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

markers =
    unit: Unit tests
    integration: Integration tests that use real AWS services
    e2e: End-to-end tests
    slow: Slow running tests
    expensive: Tests that incur AWS costs

[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
