# Root logger
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console appender
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Logger for our application
logger.app.name = com.manufacturing.analytics
logger.app.level = INFO

# Logger for Flink
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Logger for Kinesis
logger.kinesis.name = org.apache.flink.connector.kinesis
logger.kinesis.level = INFO

# Logger for AWS SDK
logger.aws.name = software.amazon.awssdk
logger.aws.level = WARN
